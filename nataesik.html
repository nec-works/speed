<style>
  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg-gradient: linear-gradient(135deg, #07050f 0%, #0d0918 50%, #040308 100%);
    --text-color: #e2e8f0;
    --card-bg: rgba(25, 18, 40, 0.45);
    --card-border: 1px solid rgba(168, 85, 247, 0.1);
    --input-bg: rgba(255, 255, 255, 0.03);
    --input-border: 1px solid rgba(168, 85, 247, 0.15);
    --input-color: #f1f5f9;
    --sub-text: #94a3b8;
  }

  [data-theme="light"] {
    --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
    --text-color: #1e293b;
    --card-bg: rgba(255, 255, 255, 0.85);
    --card-border: 1px solid rgba(168, 85, 247, 0.2);
    --input-bg: rgba(0, 0, 0, 0.02);
    --input-border: 1px solid rgba(168, 85, 247, 0.3);
    --input-color: #0f172a;
    --sub-text: #64748b;
  }

  body { 
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Apple SD Gothic Neo', sans-serif; 
    background: var(--bg-gradient);
    color: var(--text-color);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 40px) env(safe-area-inset-left);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .no-scrollbar::-webkit-scrollbar { display: none; } 
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  
  .clean-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: var(--card-border);
    box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.15);
    border-radius: 20px;
    padding: 22px;
  }
  .primary-gradient {
    background: linear-gradient(135deg, rgba(76, 29, 149, 0.85) 0%, rgba(59, 7, 100, 0.95) 100%);
    color: #ffffff !important;
    border: 1px solid rgba(168, 85, 247, 0.25);
  }
  .other-gradient {
    background: linear-gradient(135deg, rgba(30, 58, 138, 0.85) 0%, rgba(30, 27, 75, 0.95) 100%);
    color: #ffffff !important;
    border: 1px solid rgba(96, 165, 250, 0.25);
  }
  .tesla-gradient {
    background: linear-gradient(135deg, rgba(153, 27, 27, 0.85) 0%, rgba(69, 10, 10, 0.95) 100%);
    color: #ffffff !important;
    border: 1px solid rgba(239, 68, 68, 0.3);
  }
  .expense-gradient {
    background: linear-gradient(135deg, rgba(51, 65, 85, 0.85) 0%, rgba(15, 23, 42, 0.95) 100%);
    color: #ffffff !important;
    border: 1px solid rgba(148, 163, 184, 0.3);
  }
  .input-field {
    width: 100%;
    background: var(--input-bg);
    border: var(--input-border);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 16px; 
    color: var(--input-color);
    outline: none;
    transition: all 0.2s ease;
  }
  .input-field:focus {
    border-color: #a855f7;
    box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.12);
  }
  select.input-field {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a855f7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 14px;
    padding-right: 36px;
    cursor: pointer;
  }
  select.input-field option { background-color: #120a1f; color: #f1f5f9; }
  [data-theme="light"] select.input-field option { background-color: #ffffff; color: #0f172a; }

  /* 커스텀 캘린더 모달 스타일 */
  #calModal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); z-index: 1000;
    justify-content: center; align-items: center; padding: 20px;
  }
  .cal-box {
    background: #140a23; border: 1px solid rgba(168, 85, 247, 0.3);
    border-radius: 24px; width: 100%; max-width: 340px; padding: 20px; color: #f1f5f9;
  }
  [data-theme="light"] .cal-box { background: #ffffff; color: #0f172a; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; margin-top: 10px; }
  .cal-day-header { font-size: 11px; font-weight: 700; color: var(--sub-text); padding-bottom: 6px; }
  .cal-cell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 500; border-radius: 10px; cursor: pointer; color: var(--text-color);
  }
  .cal-cell:hover { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
  .cal-cell.selected { background: #7c3aed; color: #ffffff !important; font-weight: 700; }
  .cal-cell.other-month { color: #94a3b8; opacity: 0.5; }
</style>
