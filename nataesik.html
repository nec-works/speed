<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NA TEA SIK</title>

<!-- 아이폰 홈 화면 추가 및 SNS 공유 시 연동되는 메타 태그 (오픈그래프 & 애플 터치 아이콘) -->
<meta property="-apple-mobile-web-app-title" content="NA TEA SIK">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="NA TEA SIK - EV Vehicle Manager">
<meta property="og:description" content="스마트한 전기차 지출 및 크레딧 관리 차계부">
<meta property="og:image" content="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%2307050f'><rect width='512' height='512' rx='110' fill='%23140a23'/><path d='M320 120H192c-17.7 0-32 14.3-32 32v208c0 17.7 14.3 32 32 32h128c17.7 0 32-14.3 32-32V152c0-17.7-14.3-32-32-32z' fill='%237c3aed'/><path d='M256 180v152M190 256l66 66 66-66' stroke='%23ffffff' stroke-width='24' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%23140a23'><rect width='512' height='512' rx='110' fill='%23140a23'/><path d='M256 130L140 240h75v142h82V240h75L256 130z' fill='%23c084fc'/></svg>">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Apple SD Gothic Neo', sans-serif; 
    background: linear-gradient(135deg, #07050f 0%, #0d0918 50%, #040308 100%);
    color: #e2e8f0;
    padding-bottom: 60px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .no-scrollbar::-webkit-scrollbar { display: none; } 
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  
  .clean-card {
    background: rgba(25, 18, 40, 0.45);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(168, 85, 247, 0.1);
    box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
    border-radius: 20px;
    padding: 22px;
  }
  .primary-gradient {
    background: linear-gradient(135deg, rgba(76, 29, 149, 0.45) 0%, rgba(59, 7, 100, 0.6) 100%);
    color: #ffffff;
    border: 1px solid rgba(168, 85, 247, 0.25);
    box-shadow: 0 12px 35px -5px rgba(76, 29, 149, 0.25);
  }
  .other-gradient {
    background: linear-gradient(135deg, rgba(30, 58, 138, 0.45) 0%, rgba(30, 27, 75, 0.6) 100%);
    color: #ffffff;
    border: 1px solid rgba(96, 165, 250, 0.25);
    box-shadow: 0 12px 35px -5px rgba(30, 58, 138, 0.25);
  }
  .tesla-gradient {
    background: linear-gradient(135deg, rgba(153, 27, 27, 0.5) 0%, rgba(69, 10, 10, 0.7) 100%);
    color: #ffffff;
    border: 1px solid rgba(239, 68, 68, 0.3);
    box-shadow: 0 12px 35px -5px rgba(153, 27, 27, 0.3);
  }
  .expense-gradient {
    background: linear-gradient(135deg, rgba(51, 65, 85, 0.5) 0%, rgba(15, 23, 42, 0.7) 100%);
    color: #ffffff;
    border: 1px solid rgba(148, 163, 184, 0.3);
    box-shadow: 0 12px 35px -5px rgba(51, 65, 85, 0.3);
  }
  .input-field {
    width: 100%;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(168, 85, 247, 0.15);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 13px;
    color: #f1f5f9;
    outline: none;
    transition: all 0.2s ease;
  }
  .input-field:focus {
    border-color: #a855f7;
    background: rgba(255, 255, 255, 0.06);
    box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.12);
  }
  select.input-field {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a855f7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 14px;
    padding-right: 36px;
    cursor: pointer;
  }
  select.input-field option {
    background-color: #120a1f;
    color: #f1f5f9;
  }

  /* 커스텀 캘린더 모달 스타일 */
  #calModal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .cal-box {
    background: #140a23;
    border: 1px solid rgba(168, 85, 247, 0.3);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
    border-radius: 24px;
    width: 100%;
    max-width: 340px;
    padding: 20px;
    color: #f1f5f9;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    text-align: center;
    margin-top: 10px;
  }
  .cal-day-header {
    font-size: 11px;
    font-weight: 700;
    color: #94a3b8;
    padding-bottom: 6px;
  }
  .cal-cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 500;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.15s;
    color: #e2e8f0;
  }
  .cal-cell:hover {
    background: rgba(168, 85, 247, 0.2);
    color: #c084fc;
  }
  .cal-cell.selected {
    background: #7c3aed;
    color: #ffffff;
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
  }
  .cal-cell.other-month {
    color: #475569;
  }
</style>
</head>
<body>
<div style="max-width: 420px; margin: 0 auto; padding: 16px;">
  <!-- 헤더 -->
  <header style="display: flex; justify-content: space-between; align-items: center; margin: 20px 4px 16px 4px;">
    <div>
      <span style="font-size: 9px; font-weight: 700; color: #c084fc; letter-spacing: 1.5px; text-transform: uppercase;">VEHICLE MANAGER</span>
      <h1 style="font-size: 22px; font-weight: 900; color: #ffffff; letter-spacing: -0.5px; margin-top: 1px;">NA TEA SIK</h1>
    </div>
    <div style="display: flex; gap: 6px;">
      <!-- JSON 백업/복원 버튼 추가 -->
      <button onclick="exportJSON()" title="데이터 JSON 백업" style="font-size: 11px; font-weight: 600; color: #60a5fa; background: rgba(96, 165, 250, 0.1); border: 1px solid rgba(96, 165, 250, 0.2); padding: 6px 10px; border-radius: 14px; cursor: pointer; transition: 0.2s;">
        <i class="fa-solid fa-download"></i>
      </button>
      <label title="데이터 JSON 불러오기" style="font-size: 11px; font-weight: 600; color: #4ade80; background: rgba(74, 222, 128, 0.1); border: 1px solid rgba(74, 222, 128, 0.2); padding: 6px 10px; border-radius: 14px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center;">
        <i class="fa-solid fa-upload"></i>
        <input type="file" id="importFile" accept=".json" onchange="importJSON(event)" style="display: none;">
      </label>
      <button onclick="resetData()" title="데이터 초기화" style="font-size: 11px; font-weight: 600; color: #f43f5e; background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.2); padding: 6px 10px; border-radius: 14px; cursor: pointer; transition: 0.2s;">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
    </div>
  </header>

  <!-- 슬라이드 카드 영역 (총 4장) -->
  <div style="position: relative; margin-bottom: 16px;">
    <div id="cardSlider" class="no-scrollbar" style="display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; padding-bottom: 4px;">
      
      <!-- 슬라이드 1: 채비 카드 통합 현황 -->
      <section style="min-width: 100%; scroll-snap-align: center;" class="primary-gradient clean-card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <span style="font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 0.5px;">CHAEVI BALANCE</span>
            <h2 id="cardRemaining" style="font-size: 28px; font-weight: 900; margin-top: 4px; letter-spacing: -0.5px;">0 <span style="font-size: 14px; font-weight: normal; opacity: 0.7;">원</span></h2>
          </div>
          <div style="background: rgba(255,255,255,0.1); padding: 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15);">
            <i class="fa-solid fa-bolt" style="font-size: 16px; color: #facc15;"></i>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.15); font-size: 11px;">
          <div><span style="display: block; color: rgba(255,255,255,0.6); margin-bottom: 2px;">실제 사용한 금액</span><span id="realUsedDisplay" style="font-weight: 700; font-size: 12px; color: #f43f5e;">0 원</span></div>
          <div><span style="display: block; color: rgba(255,255,255,0.6); margin-bottom: 2px;">6% 할인 혜택</span><span id="chargeDiscountDisplay" style="font-weight: 700; font-size: 12px; color: #4ade80;">0 원</span></div>
          <div style="grid-column: span 2; margin-top: 4px;"><span style="display: block; color: rgba(255,255,255,0.6); margin-bottom: 2px;">총 이득 포인트 (구독+5%적립+번개)</span><span id="totalBenefitDisplay" style="font-weight: 700; font-size: 13px; color: #facc15;">0 원</span></div>
        </div>
      </section>

      <!-- 슬라이드 2: 기타 충전소 지출 -->
      <section style="min-width: 100%; scroll-snap-align: center;" class="other-gradient clean-card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <span style="font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 0.5px;">OTHER CHARGERS</span>
            <h2 id="totalOtherChargeDisplay" style="font-size: 28px; font-weight: 900; margin-top: 4px; letter-spacing: -0.5px;">0 <span style="font-size: 14px; font-weight: normal; opacity: 0.7;">원</span></h2>
          </div>
          <div style="background: rgba(255,255,255,0.1); padding: 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15);">
            <i class="fa-solid fa-gas-pump" style="font-size: 16px; color: #60a5fa;"></i>
          </div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.15); font-size: 11px;">
          <span style="color: rgba(255,255,255,0.6);">타 충전소 이용 건수</span>
          <span id="otherChargeCountDisplay" style="font-weight: 700; font-size: 13px;">0 건</span>
        </div>
      </section>

      <!-- 슬라이드 3: 테슬라 슈퍼차저 충전 내역 -->
      <section style="min-width: 100%; scroll-snap-align: center;" class="tesla-gradient clean-card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <span style="font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 0.5px;">SUPERCHARGER</span>
            <h2 id="totalTeslaDisplay" style="font-size: 28px; font-weight: 900; margin-top: 4px; letter-spacing: -0.5px;">0 <span style="font-size: 14px; font-weight: normal; opacity: 0.7;">원</span></h2>
          </div>
          <div style="background: rgba(255,255,255,0.12); width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.2);">
            <svg style="width: 22px; height: 22px; fill: #ffffff;" viewBox="0 0 100 100">
              <path d="M96.5,15.2C85,12.7,46.5,12,46.5,12s-38.5,0.7-50,3.2C6.3,16.5,3.7,21.5,4,27.5C4.3,34,5,44,5,44s3.7,1,11,1.5 c6,0.5,10.2-0.5,11-1.5c0,0,0.5-12.2,0.7-18c0.2-5.8,1.2-7.5,7-7.7c11.5-0.5,31-0.7,31-0.7s19.5,0.2,31,0.7c5.8,0.2,6.8,1.8,7,7.7 c0.2,5.8,0.7,18,0.7,18c0.8,1,5,2,11,1.5c7.3-0.5,11-1.5,11-1.5s0.7-10,1-16.5C96.3,21.5,93.7,16.5,96.5,15.2z"/>
              <path d="M41,35.5c0,0-1,34-1,40.5c0,6.5,2,9,9.5,9.5c7.5,0.5,9.5-3,9.5-9.5c0-6.5-1-40.5-1-40.5s-8.5-0.2-17,0-8.5,0-8.5,0Z"/>
            </svg>
          </div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.15); font-size: 11px;">
          <span style="color: rgba(255,255,255,0.7);">슈퍼차저 누적 건수</span>
          <span id="teslaCountDisplay" style="font-weight: 700; font-size: 13px;">0 건</span>
        </div>
      </section>

      <!-- 슬라이드 4: 일반 지출 (정비 및 기타) -->
      <section style="min-width: 100%; scroll-snap-align: center;" class="expense-gradient clean-card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <span style="font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 0.5px;">GENERAL EXPENSE</span>
            <h2 id="totalGeneralExpenseDisplay" style="font-size: 28px; font-weight: 900; margin-top: 4px; letter-spacing: -0.5px;">0 <span style="font-size: 14px; font-weight: normal; opacity: 0.7;">원</span></h2>
          </div>
          <div style="background: rgba(255,255,255,0.1); padding: 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15);">
            <i class="fa-solid fa-wrench" style="font-size: 16px; color: #cbd5e1;"></i>
          </div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.15); font-size: 11px;">
          <span style="color: rgba(255,255,255,0.7);">지출 내역 건수</span>
          <span id="generalExpenseCountDisplay" style="font-weight: 700; font-size: 13px;">0 건</span>
        </div>
      </section>

    </div>
    <!-- 슬라이드 인디케이터 점 (총 4개) -->
    <div style="display: flex; justify-content: center; gap: 5px; margin-top: 10px;" id="dotContainer">
      <button onclick="scrollToCard(0)" id="dot0" style="width: 16px; height: 5px; border-radius: 3px; background: #c084fc; border: none; cursor: pointer; transition: 0.2s;"></button>
      <button onclick="scrollToCard(1)" id="dot1" style="width: 5px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.2); border: none; cursor: pointer; transition: 0.2s;"></button>
      <button onclick="scrollToCard(2)" id="dot2" style="width: 5px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.2); border: none; cursor: pointer; transition: 0.2s;"></button>
      <button onclick="scrollToCard(3)" id="dot3" style="width: 5px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.2); border: none; cursor: pointer; transition: 0.2s;"></button>
    </div>
  </div>

  <!-- 총 지출 금액 박스 -->
  <section class="clean-card" style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; padding: 18px 20px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="background: rgba(244, 63, 94, 0.15); color: #f43f5e; width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; border: 1px solid rgba(244, 63, 94, 0.3);">
        <i class="fa-solid fa-wallet"></i>
      </div>
      <div>
        <span style="font-size: 10px; font-weight: 700; color: #a78bfa; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 1px;">TOTAL EXPENSE</span>
        <span style="font-size: 10px; color: #94a3b8;">통장 출금 총액 기준</span>
      </div>
    </div>
    <div style="text-align: right;">
      <h3 id="totalExpenseDisplay" style="font-size: 20px; font-weight: 900; color: #f43f5e; letter-spacing: -0.5px;">0 원</h3>
    </div>
  </section>

  <!-- 새 내역 기록하기 -->
  <section class="clean-card" style="margin-bottom: 16px;">
    <h3 style="font-size: 13px; font-weight: 800; color: #ffffff; margin-bottom: 14px; display: flex; align-items: center; gap: 6px;">
      <i class="fa-solid fa-pen-to-square" style="color: #c084fc;"></i> 새 내역 기록하기
    </h3>
    <form id="recordForm" style="display: flex; flex-direction: column; gap: 12px;">
      <div>
        <label style="display: block; font-size: 11px; font-weight: 700; color: #cbd5e1; margin-bottom: 5px;">구분</label>
        <select id="category" onchange="handleCategoryInput()" class="input-field" required>
          <option value="채비 카드 잔여">[채비] 카드 잔여금 기입</option>
          <option value="채비 카드충전">[채비] 카드 선금 충전</option>
          <option value="채비 번개크레딧">[채비] 번개 크래딧</option>
          <option value="기타 충전소 차감">[충전] 기타</option>
          <option value="테슬라 충전지출">[충전] 슈퍼차저</option>
          <option value="정비항목 지출내역">[지출] 기타</option>
        </select>
      </div>
      <div>
        <label style="display: block; font-size: 11px; font-weight: 700; color: #cbd5e1; margin-bottom: 5px;">날짜</label>
        <div onclick="openCalendar()" class="input-field" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
          <span id="selectedDateText">날짜를 선택하세요</span>
          <i class="fa-regular fa-calendar" style="color: #c084fc;"></i>
        </div>
        <input type="hidden" id="recordDate" required>
      </div>
      <div>
        <label id="amountLabel" style="display: block; font-size: 11px; font-weight: 700; color: #cbd5e1; margin-bottom: 5px;">금액 (원)</label>
        <input type="number" id="amount" placeholder="금액을 입력하세요" class="input-field" required>
        <p id="pointPreview" style="font-size: 11px; font-weight: 600; color: #c084fc; margin-top: 5px; display: none;"></p>
      </div>
      <div>
        <label style="display: block; font-size: 11px; font-weight: 700; color: #cbd5e1; margin-bottom: 5px;">상세 내용 / 메모</label>
        <input type="text" id="memo" placeholder="예: 슈퍼차저, 타이어 교환 등" class="input-field">
      </div>
      <button type="submit" style="width: 100%; background: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%); color: #ffffff; font-weight: 700; padding: 12px; border-radius: 12px; border: 1px solid rgba(168, 85, 247, 0.4); cursor: pointer; font-size: 13px; transition: 0.2s; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3); margin-top: 2px;">
        <i class="fa-solid fa-check" style="margin-right: 5px;"></i> 저장하기
      </button>
    </form>
  </section>

  <!-- 기록 목록 및 통계 -->
  <section class="clean-card">
    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-size: 13px; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 6px;">
          <i class="fa-solid fa-list" style="color: #c084fc;"></i> 기록 목록
        </h3>
        <span id="recordCount" style="font-size: 10px; font-weight: 700; background: rgba(255,255,255,0.08); color: #cbd5e1; padding: 2px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);">0건</span>
      </div>
      <div style="display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 6px;">
        <select id="filterCategory" onchange="handleCategoryChange()" class="input-field" style="padding: 8px 10px; font-size: 10px;">
          <option value="">전체보기</option>
          <option value="채비 카드 잔여">[채비] 카드 잔여</option>
          <option value="채비 카드충전">[채비] 카드충전</option>
          <option value="채비 총구독비">[채비] 총구독비</option>
          <option value="채비 월 보너스 크레딧">[채비] 월 보너스 크레딧</option>
          <option value="채비 보너스포인트 적립">[채비] 충전 적립 5%</option>
          <option value="채비 번개크레딧">[채비] 번개크레딧</option>
          <option value="기타 충전소 차감">[충전] 기타</option>
          <option value="테슬라 충전지출">[충전] 슈퍼차저</option>
          <option value="정비항목 지출내역">[지출] 기타</option>
        </select>
        <select id="filterYear" onchange="handleYearChange()" class="input-field" style="padding: 8px 10px; font-size: 10px;" disabled><option value="">연도 선택</option></select>
        <select id="filterMonth" onchange="renderApp()" class="input-field" style="padding: 8px 10px; font-size: 10px;" disabled><option value="">월 선택</option></select>
      </div>
    </div>
    <div id="recordList" style="display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; padding-right: 2px;"></div>
  </section>
</div>

<!-- 커스텀 캘린더 모달 -->
<div id="calModal" onclick="if(event.target === this) closeCalendar()">
  <div class="cal-box">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <button onclick="changeMonth(-1)" style="background: none; border: none; color: #c084fc; cursor: pointer; font-size: 14px; padding: 6px 10px;"><i class="fa-solid fa-chevron-left"></i></button>
      <h3 id="calTitle" style="font-size: 15px; font-weight: 800; color: #ffffff;">2026년 4월</h3>
      <button onclick="changeMonth(1)" style="background: none; border: none; color: #c084fc; cursor: pointer; font-size: 14px; padding: 6px 10px;"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
    <div class="cal-grid">
      <div class="cal-day-header" style="color: #f43f5e;">일</div>
      <div class="cal-day-header">월</div>
      <div class="cal-day-header">화</div>
      <div class="cal-day-header">수</div>
      <div class="cal-day-header">목</div>
      <div class="cal-day-header">금</div>
      <div class="cal-day-header" style="color: #60a5fa;">토</div>
    </div>
    <div id="calDays" class="cal-grid"></div>
    <button onclick="closeCalendar()" style="width: 100%; background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.3); color: #c084fc; font-weight: 700; padding: 10px; border-radius: 12px; margin-top: 16px; cursor: pointer; font-size: 12px;">닫기</button>
  </div>
</div>

<script>
let currentCalDate = new Date();
let selectedDateStr = new Date().toISOString().split('T')[0];

function initCalendarUI() {
  document.getElementById('recordDate').value = selectedDateStr;
  const d = new Date(selectedDateStr);
  document.getElementById('selectedDateText').textContent = `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')}`;
}

function openCalendar() {
  document.getElementById('calModal').style.display = 'flex';
  renderCalendarGrid();
}

function closeCalendar() {
  document.getElementById('calModal').style.display = 'none';
}

function changeMonth(diff) {
  currentCalDate.setMonth(currentCalDate.getMonth() + diff);
  renderCalendarGrid();
}

function renderCalendarGrid() {
  const year = currentCalDate.getFullYear();
  const month = currentCalDate.getMonth();
  document.getElementById('calTitle').textContent = `${year}년 ${month + 1}월`;

  const firstDay = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month + 1, 0).getDate();
  const prevLastDate = new Date(year, month, 0).getDate();

  let daysHtml = '';

  for (let i = firstDay - 1; i >= 0; i--) {
    const dayNum = prevLastDate - i;
    const prevMonth = month === 0 ? 11 : month - 1;
    const prevYear = month === 0 ? year - 1 : year;
    const fullStr = `${prevYear}-${String(prevMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
    daysHtml += `<div class="cal-cell other-month" onclick="selectDate('${fullStr}')">${dayNum}</div>`;
  }

  for (let i = 1; i <= lastDate; i++) {
    const fullStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    const isSelected = fullStr === selectedDateStr ? 'selected' : '';
    daysHtml += `<div class="cal-cell ${isSelected}" onclick="selectDate('${fullStr}')">${i}</div>`;
  }

  const totalCells = firstDay + lastDate;
  const nextDays = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let i = 1; i <= nextDays; i++) {
    const nextMonth = month === 11 ? 0 : month + 1;
    const nextYear = month === 11 ? year + 1 : year;
    const fullStr = `${nextYear}-${String(nextMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    daysHtml += `<div class="cal-cell other-month" onclick="selectDate('${fullStr}')">${i}</div>`;
  }

  document.getElementById('calDays').innerHTML = daysHtml;
}

function selectDate(dateStr) {
  selectedDateStr = dateStr;
  document.getElementById('recordDate').value = dateStr;
  const d = new Date(dateStr);
  document.getElementById('selectedDateText').textContent = `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')}`;
  closeCalendar();
}

initCalendarUI();

let records = JSON.parse(localStorage.getItem('nathe_car_records')) || [];

function checkAndGenerateAutomaticRecords() {
  let modified = false; 
  const now = new Date(); 
  const currentYear = now.getFullYear(); 
  const currentMonth = now.getMonth() + 1;

  let targetMonths = [];
  for (let m = 7; m <= 10; m++) { targetMonths.push({ year: 2026, month: m }); }
  if (currentYear > 2026 || (currentYear === 2026 && currentMonth >= 11)) {
    for (let m = 11; m <= currentMonth; m++) {
      const checkDate = new Date(currentYear, m - 1, 12);
      if (now >= checkDate) { targetMonths.push({ year: currentYear, month: m }); }
    }
  }

  targetMonths.forEach(item => {
    const mm = String(item.month).padStart(2, '0'); 
    const dateStr = `${item.year}-${mm}-12`;

    const subExists = records.some(r => (r.category === '채비 월 구독비' || r.category === '채비 총구독비') && r.date === dateStr);
    if (!subExists) { 
      records.push({ id: Date.now() + Math.random(), category: '채비 총구독비', date: dateStr, amount: 4900, memo: `${item.month}월 정기 구독비` }); 
      modified = true; 
    }

    const bonusExists = records.some(r => (r.category === '채비 월 보너스포인트' || r.category === '채비 월 보너스 크레딧') && r.date === dateStr);
    if (!bonusExists) { 
      records.push({ id: Date.now() + Math.random(), category: '채비 월 보너스 크레딧', date: dateStr, amount: 3000, memo: `${item.month}월 정기 보너스크레딧` }); 
      modified = true; 
    }
  });

  if (modified) { 
    localStorage.setItem('nathe_car_records', JSON.stringify(records)); 
  }
}
checkAndGenerateAutomaticRecords();

function resetData() {
  if (confirm('모든 기록을 초기화하고 새로 시작하시겠습니까?')) {
    localStorage.removeItem('nathe_car_records');
    records = [];
    checkAndGenerateAutomaticRecords();
    saveAndRender();
  }
}

// JSON 백업 다운로드 함수
function exportJSON() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", "nathe_car_backup.json");
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

// JSON 복원 업로드 함수
function importJSON(event) {
  const fileReader = new FileReader();
  if(event.target.files[0]) {
    fileReader.readAsText(event.target.files[0], "UTF-8");
    fileReader.onload = (e) => {
      try {
        const importedRecords = JSON.parse(e.target.result);
        if (Array.isArray(importedRecords)) {
          records = importedRecords;
          saveAndRender();
          alert('데이터를 성공적으로 불러왔습니다!');
        } else {
          alert('올바른 데이터 형식이 아닙니다.');
        }
      } catch (err) {
        alert('JSON 파일 파싱 중 오류가 발생했습니다.');
      }
    };
  }
}

const recordForm = document.getElementById('recordForm'); 
const recordList = document.getElementById('recordList');
const realUsedDisplay = document.getElementById('realUsedDisplay'); 
const chargeDiscountDisplay = document.getElementById('chargeDiscountDisplay');
const totalBenefitDisplay = document.getElementById('totalBenefitDisplay');
const totalOtherChargeDisplay = document.getElementById('totalOtherChargeDisplay'); 
const otherChargeCountDisplay = document.getElementById('otherChargeCountDisplay');
const totalTeslaDisplay = document.getElementById('totalTeslaDisplay');
const teslaCountDisplay = document.getElementById('teslaCountDisplay');
const totalGeneralExpenseDisplay = document.getElementById('totalGeneralExpenseDisplay');
const generalExpenseCountDisplay = document.getElementById('generalExpenseCountDisplay');
const totalExpenseDisplay = document.getElementById('totalExpenseDisplay'); 
const recordCountEl = document.getElementById('recordCount');
const categorySelect = document.getElementById('category'); 
const amountInput = document.getElementById('amount'); 
const amountLabel = document.getElementById('amountLabel'); 
const pointPreview = document.getElementById('pointPreview');
const filterCategory = document.getElementById('filterCategory'); 
const filterYear = document.getElementById('filterYear'); 
const filterMonth = document.getElementById('filterMonth');
const cardSlider = document.getElementById('cardSlider'); 
const dots = [document.getElementById('dot0'), document.getElementById('dot1'), document.getElementById('dot2'), document.getElementById('dot3')];

cardSlider.addEventListener('scroll', () => {
  const scrollLeft = cardSlider.scrollLeft; const width = cardSlider.clientWidth; const index = Math.round(scrollLeft / width);
  updateDots(index);
});

function updateDots(index) {
  dots.forEach((dot, idx) => { 
    dot.style.width = idx === index ? "16px" : "5px";
    dot.style.background = idx === index ? "#c084fc" : "rgba(255,255,255,0.2)";
  });
}

function scrollToCard(index) { 
  cardSlider.scrollTo({ left: cardSlider.clientWidth * index, behavior: 'smooth' }); 
  updateDots(index);
}

// 구분 셀렉트 선택 시 슬라이드 1~4 매칭 자동 이동
function handleCategoryInput() {
  const cat = categorySelect.value;
  amountInput.readOnly = false; amountLabel.textContent = "금액 (원)";
  if (cat === '채비 카드충전') { updatePointPreview(); } else { pointPreview.style.display = 'none'; }

  if (cat.startsWith('채비')) {
    scrollToCard(0); // 슬라이드 1: 채비
  } else if (cat === '기타 충전소 차감') {
    scrollToCard(1); // 슬라이드 2: 충전 기타
  } else if (cat === '테슬라 충전지출') {
    scrollToCard(2); // 슬라이드 3: 충전 슈퍼차저
  } else if (cat === '정비항목 지출내역') {
    scrollToCard(3); // 슬라이드 4: 지출 기타
  }
}

amountInput.addEventListener('input', () => { if (categorySelect.value === '채비 카드충전') { updatePointPreview(); } });
function updatePointPreview() {
  const val = Number(amountInput.value) || 0; const earnedPoint = Math.floor(val * 0.05);
  if (val > 0) { 
    pointPreview.textContent = `💡 저장 시 5% 적립금 (${earnedPoint.toLocaleString()}원)이 자동 적립됩니다.`; 
    pointPreview.style.display = 'block'; 
  } else { 
    pointPreview.style.display = 'none'; 
  }
}
handleCategoryInput();

recordForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const category = categorySelect.value; const date = document.getElementById('recordDate').value; const amount = Number(amountInput.value); const memo = document.getElementById('memo').value;
  records.push({ id: Date.now(), category, date, amount, memo });
  if (category === '채비 카드충전') {
    const earnedPoint = Math.floor(amount * 0.05);
    if (earnedPoint > 0) { records.push({ id: Date.now() + 1, category: '채비 보너스포인트 적립', date, amount: earnedPoint, memo: memo ? `${memo} 충전 적립 5%` : '충전 적립 5%' }); }
  }
  saveAndRender(); recordForm.reset(); initCalendarUI(); handleCategoryInput();
});

function saveAndRender() { localStorage.setItem('nathe_car_records', JSON.stringify(records)); updateFilterYears(); renderApp(); }

function handleCategoryChange() {
  const catVal = filterCategory.value;
  if (!catVal) { filterYear.value = ""; filterYear.disabled = true; filterYear.innerHTML = '<option value="">연도 선택</option>'; filterMonth.value = ""; filterMonth.disabled = true; filterMonth.innerHTML = '<option value="">월 선택</option>'; }
  else { updateFilterYears(); filterYear.disabled = false; filterMonth.value = ""; filterMonth.disabled = true; filterMonth.innerHTML = '<option value="">월 선택</option>'; }
  renderApp();
}
function handleYearChange() {
  const yearVal = filterYear.value;
  if (!yearVal) { filterMonth.value = ""; filterMonth.disabled = true; filterMonth.innerHTML = '<option value="">월 선택</option>'; } else { updateFilterMonths(); filterMonth.disabled = false; }
  renderApp();
}
function updateFilterYears() {
  const catVal = filterCategory.value; const filtered = catVal ? records.filter(r => r.category === catVal || (catVal === '채비 총구독비' && (r.category === '채비 월 구독비' || r.category === '채비 총구독비')) || (catVal === '채비 월 보너스 크레딧' && (r.category === '채비 월 보너스포인트' || r.category === '채비 월 보너스 크레딧')) || (catVal === '채비 보너스포인트 적립' && r.category === '채비 보너스포인트 적립')) : records;
  const years = [...new Set(filtered.map(r => r.date.split('-')[0]))].sort().reverse();
  const currentYear = filterYear.value; let optionsHtml = '<option value="">모든 연도</option>';
  years.forEach(y => { optionsHtml += `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y}년</option>`; });
  filterYear.innerHTML = optionsHtml;
  if (years.length === 0) { filterYear.value = ""; filterYear.disabled = true; }
}
function updateFilterMonths() {
  const catVal = filterCategory.value; const yearVal = filterYear.value;
  const filtered = records.filter(r => { const [y, m] = r.date.split('-'); const matchCat = !catVal || r.category === catVal || (catVal === '채비 총구독비' && (r.category === '채비 월 구독비' || r.category === '채비 총구독비')) || (catVal === '채비 월 보너스 크레딧' && (r.category === '채비 월 보너스포인트' || r.category === '채비 월 보너스 크레딧')) || (catVal === '채비 보너스포인트 적립' && r.category === '채비 보너스포인트 적립'); return matchCat && (!yearVal || y === yearVal); });
  const months = [...new Set(filtered.map(r => r.date.split('-')[1]))].sort();
  const currentMonth = filterMonth.value; let optionsHtml = '<option value="">모든 월</option>';
  months.forEach(m => { optionsHtml += `<option value="${m}" ${m === currentMonth ? 'selected' : ''}>${Number(m)}월</option>`; });
  filterMonth.innerHTML = optionsHtml;
  if (months.length === 0) { filterMonth.value = ""; filterMonth.disabled = true; }
}

function deleteRecord(id) { if(confirm('정말 이 내역을 삭제하시겠습니까?')) { records = records.filter(r => r.id !== id); saveAndRender(); } }

function renderApp() {
  let totalRealCharge = 0; 
  let totalExpense = 0;    
  let totalBenefit = 0;    
  let totalOtherCharge = 0; 
  let otherChargeCount = 0; 
  let totalTesla = 0;
  let teslaCount = 0;
  let totalGeneralExpense = 0;
  let generalExpenseCount = 0;
  let manualRemaining = null; 
  let latestRemainingDate = "";

  records.forEach(r => {
    if (r.category === '채비 카드충전') { 
      totalRealCharge += r.amount; 
      totalExpense += r.amount; 
    }
    else if (r.category === '채비 카드 잔여') { 
      if (!latestRemainingDate || r.date >= latestRemainingDate) { 
        manualRemaining = r.amount; 
        latestRemainingDate = r.date; 
      } 
    }
    else if (r.category === '채비 보너스포인트 적립' || r.category === '채비 월 보너스포인트' || r.category === '채비 월 보너스 크레딧' || r.category === '채비 번개크레딧') { 
      totalBenefit += r.amount; 
    }
    else if (r.category === '기타 충전소 차감') { 
      totalOtherCharge += r.amount; 
      otherChargeCount++; 
      totalExpense += r.amount; 
    }
    else if (r.category === '테슬라 충전지출') {
      totalTesla += r.amount;
      teslaCount++;
      totalExpense += r.amount;
    }
    else if (r.category === '정비항목 지출내역' || r.category === '기타 지출내역') {
      totalGeneralExpense += r.amount;
      generalExpenseCount++;
      totalExpense += r.amount;
    }
    else { 
      totalExpense += r.amount; 
    }
  });

  let totalEarnedBenefit = totalBenefit;
  let finalCardRemaining = manualRemaining !== null ? manualRemaining : (totalRealCharge + totalEarnedBenefit);
  let realUsedAmount = (totalRealCharge + totalEarnedBenefit) - finalCardRemaining;
  if (realUsedAmount < 0) realUsedAmount = 0;

  let chargeDiscountAmount = Math.floor(realUsedAmount * 0.06);

  document.getElementById('cardRemaining').textContent = finalCardRemaining.toLocaleString() + " 원";
  realUsedDisplay.textContent = realUsedAmount.toLocaleString() + " 원";
  chargeDiscountDisplay.textContent = chargeDiscountAmount.toLocaleString() + " 원";
  totalBenefitDisplay.textContent = totalEarnedBenefit.toLocaleString() + " 원";

  totalOtherChargeDisplay.innerHTML = `${totalOtherCharge.toLocaleString()} <span style="font-size: 14px; font-weight: normal; opacity: 0.7;">원</span>`;
  otherChargeCountDisplay.textContent = `${otherChargeCount}건`;

  totalTeslaDisplay.innerHTML = `${totalTesla.toLocaleString()} <span style="font-size: 14px; font-weight: normal; opacity: 0.7;">원</span>`;
  teslaCountDisplay.textContent = `${teslaCount}건`;

  totalGeneralExpenseDisplay.innerHTML = `${totalGeneralExpense.toLocaleString()} <span style="font-size: 14px; font-weight: normal; opacity: 0.7;">원</span>`;
  generalExpenseCountDisplay.textContent = `${generalExpenseCount}건`;

  totalExpenseDisplay.textContent = `${totalExpense.toLocaleString()} 원`;

  const catVal = filterCategory.value; const yearVal = filterYear.value; const monthVal = filterMonth.value;
  let displayedRecords = records.filter(r => {
    const [y, m] = r.date.split('-');
    const matchCat = !catVal || r.category === catVal || (catVal === '채비 총구독비' && (r.category === '채비 월 구독비' || r.category === '채비 총구독비')) || (catVal === '채비 월 보너스 크레딧' && (r.category === '채비 월 보너스포인트' || r.category === '채비 월 보너스 크레딧')) || (catVal === '채비 보너스포인트 적립' && r.category === '채비 보너스포인트 적립');
    const matchYear = !yearVal || y === yearVal; const matchMonth = !monthVal || m === monthVal;
    return matchCat && matchYear && matchMonth;
  });
  displayedRecords.sort((a, b) => new Date(b.date) - new Date(a.date));
  recordCountEl.textContent = `${displayedRecords.length}건`;

  if (displayedRecords.length === 0) {
    recordList.innerHTML = `<div style="text-align: center; padding: 24px 0; color: #94a3b8; font-size: 11px;"><i class="fa-regular fa-folder-open" style="font-size: 20px; margin-bottom: 6px; display: block;"></i>조건에 일치하는 기록이 없습니다.</div>`;
    return;
  }

  let html = '';
  displayedRecords.forEach(r => {
    let badgeBg = 'rgba(168, 85, 247, 0.1)';
    let badgeColor = '#c084fc';
    let displaySign = '';
    let amountColor = '#f1f5f9';

    const catName = (r.category === '채비 월 구독비' || r.category === '채비 총구독비') ? '[채비] 총구독비' : ((r.category === '채비 월 보너스포인트' || r.category === '채비 월 보너스 크레딧') ? '[채비] 월 보너스 크레딧' : (r.category === '채비 보너스포인트 적립' ? '[채비] 충전 적립 5%' : r.category));

    if (r.category === '채비 카드충전') { badgeBg = 'rgba(34, 197, 94, 0.1)'; badgeColor = '#4ade80'; displaySign = '-'; amountColor = '#f43f5e'; }
    else if (r.category === '채비 카드 잔여') { badgeBg = 'rgba(168, 85, 247, 0.1)'; badgeColor = '#c084fc'; }
    else if (r.category === '채비 월 구독비' || r.category === '채비 총구독비') { badgeBg = 'rgba(6, 182, 212, 0.1)'; badgeColor = '#22d3ee'; displaySign = '-'; amountColor = '#f43f5e'; }
    else if (r.category === '채비 월 보너스포인트' || r.category === '채비 월 보너스 크레딧' || r.category === '채비 보너스포인트 적립' || r.category === '채비 번개크레딧') { badgeBg = 'rgba(168, 85, 247, 0.1)'; badgeColor = '#c084fc'; }
    else if (r.category === '기타 충전소 차감') { badgeBg = 'rgba(147, 51, 234, 0.1)'; badgeColor = '#c084fc'; displaySign = '-'; amountColor = '#f43f5e'; }
    else if (r.category === '테슬라 충전지출') { badgeBg = 'rgba(239, 68, 68, 0.15)'; badgeColor = '#f87171'; displaySign = '-'; amountColor = '#f43f5e'; }
    else if (r.category === '정비항목 지출내역' || r.category === '기타 지출내역') { badgeBg = 'rgba(51, 65, 85, 0.3)'; badgeColor = '#94a3b8'; displaySign = '-'; amountColor = '#f43f5e'; }

    html += `<div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(168, 85, 247, 0.1); border-radius: 12px; transition: 0.2s;">
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <div style="display: flex; align-items: center; gap: 5px;">
          <span style="font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: ${badgeBg}; color: ${badgeColor};">${catName}</span>
          <span style="font-size: 10px; color: #94a3b8;">${r.date}</span>
        </div>
        <p style="font-size: 11px; font-weight: 500; color: #cbd5e1;">${r.memo ? r.memo : '메모 없음'}</p>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 13px; font-weight: 800; color: ${amountColor};">${displaySign}${r.amount.toLocaleString()}원</span>
        <button onclick="deleteRecord(${r.id})" style="background: none; border: none; color: #64748b; cursor: pointer; font-size: 12px; transition: 0.2s;" onmouseover="this.style.color='#f43f5e'" onmouseout="this.style.color='#64748b'"><i class="fa-solid fa-trash-can"></i></button>
      </div>
    </div>`;
  });
  recordList.innerHTML = html;
}
saveAndRender();
</script>
</body>
</html>
