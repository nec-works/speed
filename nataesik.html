<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 핀치 줌 및 인풋 포커스 시 화면 확대 방지 메타 태그 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NA TEA SIK</title>

<!-- 아이폰 홈 화면 추가 및 SNS 공유 메타 태그 -->
<meta property="-apple-mobile-web-app-title" content="NA TEA SIK">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="NA TEA SIK - EV Vehicle Manager">
<meta property="og:description" content="스마트한 전기차 지출 및 크레딧 관리 차계부">
<meta property="og:image" content="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%2307050f'><rect width='512' height='512' rx='110' fill='%23140a23'/><path d='M320 120H192c-17.7 0-32 14.3-32 32v208c0 17.7 14.3 32 32 32h128c17.7 0 32-14.3 32-32V152c0-17.7-14.3-32-32-32z' fill='%237c3aed'/><path d='M256 180v152M190 256l66 66 66-66' stroke='%23ffffff' stroke-width='24' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%23140a23'><rect width='512' height='512' rx='110' fill='%23140a23'/><path d='M256 130L140 240h75v142h82V240h75L256 130z' fill='%23c084fc'/></svg>">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
  
  :root {
    --bg-gradient: linear-gradient(135deg, #07050f 0%, #0d0918 50%, #040308 100%);
    --text-color: #e2e8f0;
    --card-bg: rgba(25, 18, 40, 0.45);
    --card-border: 1px solid rgba(168, 85, 247, 0.1);
    --input-bg: rgba(255, 255, 255, 0.03);
    --input-border: 1px solid rgba(168, 85, 247, 0.15);
    --input-color: #f1f5f9;
    --sub-text: #94a3b8;
  }

  [data-theme="light"] {
    --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
    --text-color: #1e293b;
    --card-bg: rgba(255, 255, 255, 0.85);
    --card-border: 1px solid rgba(168, 85, 247, 0.2);
    --input-bg: rgba(0, 0, 0, 0.02);
    --input-border: 1px solid rgba(168, 85, 247, 0.3);
    --input-color: #0f172a;
    --sub-text: #64748b;
  }

  body { 
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Apple SD Gothic Neo', sans-serif; 
    background: var(--bg-gradient);
    color: var(--text-color);
    padding-bottom: 60px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .no-scrollbar::-webkit-scrollbar { display: none; } 
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  
  .clean-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: var(--card-border);
    box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.15);
    border-radius: 20px;
    padding: 22px;
  }
  .primary-gradient {
    background: linear-gradient(135deg, rgba(76, 29, 149, 0.85) 0%, rgba(59, 7, 100, 0.95) 100%);
    color: #ffffff !important;
    border: 1px solid rgba(168, 85, 247, 0.25);
  }
  .other-gradient {
    background: linear-gradient(135deg, rgba(30, 58, 138, 0.85) 0%, rgba(30, 27, 75, 0.95) 100%);
    color: #ffffff !important;
    border: 1px solid rgba(96, 165, 250, 0.25);
  }
  .tesla-gradient {
    background: linear-gradient(135deg, rgba(153, 27, 27, 0.85) 0%, rgba(69, 10, 10, 0.95) 100%);
    color: #ffffff !important;
    border: 1px solid rgba(239, 68, 68, 0.3);
  }
  .expense-gradient {
    background: linear-gradient(135deg, rgba(51, 65, 85, 0.85) 0%, rgba(15, 23, 42, 0.95) 100%);
    color: #ffffff !important;
    border: 1px solid rgba(148, 163, 184, 0.3);
  }
  .input-field {
    width: 100%;
    background: var(--input-bg);
    border: var(--input-border);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 16px; 
    color: var(--input-color);
    outline: none;
    transition: all 0.2s ease;
  }
  .input-field:focus {
    border-color: #a855f7;
    box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.12);
  }
  select.input-field {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a855f7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 14px;
    padding-right: 36px;
    cursor: pointer;
  }
  select.input-field option { background-color: #120a1f; color: #f1f5f9; }
  [data-theme="light"] select.input-field option { background-color: #ffffff; color: #0f172a; }

  /* 커스텀 캘린더 모달 스타일 */
  #calModal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); z-index: 1000;
    justify-content: center; align-items: center; padding: 20px;
  }
  .cal-box {
    background: #140a23; border: 1px solid rgba(168, 85, 247, 0.3);
    border-radius: 24px; width: 100%; max-width: 340px; padding: 20px; color: #f1f5f9;
  }
  [data-theme="light"] .cal-box { background: #ffffff; color: #0f172a; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; margin-top: 10px; }
  .cal-day-header { font-size: 11px; font-weight: 700; color: var(--sub-text); padding-bottom: 6px; }
  .cal-cell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 500; border-radius: 10px; cursor: pointer; color: var(--text-color);
  }
  .cal-cell:hover { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
  .cal-cell.selected { background: #7c3aed; color: #ffffff !important; font-weight: 700; }
  .cal-cell.other-month { color: #94a3b8; opacity: 0.5; }
</style>
</head>
<body>
<div style="max-width: 420px; margin: 0 auto; padding: 16px;">
  <!-- 헤더 -->
  <header style="display: flex; justify-content: space-between; align-items: center; margin: 28px 4px 16px 4px;">
    <div>
      <span style="font-size: 9px; font-weight: 700; color: #c084fc; letter-spacing: 1.5px; text-transform: uppercase;">GIST SYNC MANAGER</span>
      <h1 style="font-size: 22px; font-weight: 900; letter-spacing: -0.5px; margin-top: 1px;">NA TEA SIK</h1>
    </div>
    <div style="display: flex; gap: 4px;">
      <!-- 테마 전환 버튼 -->
      <button type="button" onclick="toggleTheme()" id="themeBtn" title="테마 전환" style="font-size: 11px; font-weight: 600; color: #c084fc; background: rgba(192, 132, 252, 0.1); border: 1px solid rgba(192, 132, 252, 0.2); padding: 8px 10px; border-radius: 14px; cursor: pointer;">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
      </button>
      <!-- Gist 수동 동기화 불러오기 버튼 -->
      <button type="button" onclick="loadFromGist()" title="Gist에서 불러오기" style="font-size: 11px; font-weight: 600; color: #38bdf8; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); padding: 8px 10px; border-radius: 14px; cursor: pointer;">
        <i class="fa-solid fa-cloud-arrow-down"></i> 동기화
      </button>
      <!-- 초기화 버튼 -->
      <button type="button" onclick="resetData()" title="초기화" style="font-size: 11px; font-weight: 600; color: #f43f5e; background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.2); padding: 8px 10px; border-radius: 14px; cursor: pointer;">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
    </div>
  </header>

  <!-- 슬라이드 카드 영역 (총 4장) -->
  <div style="position: relative; margin-bottom: 16px;">
    <div id="cardSlider" class="no-scrollbar" style="display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; padding-bottom: 4px;">
      
      <section style="min-width: 100%; scroll-snap-align: center;" class="primary-gradient clean-card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <span style="font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.7); text-transform: uppercase;">CHAEVI BALANCE</span>
            <h2 id="cardRemaining" style="font-size: 28px; font-weight: 900; margin-top: 4px;">0 <span style="font-size: 14px; font-weight: normal; opacity: 0.7;">원</span></h2>
          </div>
          <div style="background: rgba(255,255,255,0.15); padding: 10px; border-radius: 14px;"><i class="fa-solid fa-bolt" style="font-size: 16px; color: #facc15;"></i></div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.2); font-size: 11px;">
          <div><span style="display: block; color: rgba(255,255,255,0.7); margin-bottom: 2px;">실제 사용한 금액</span><span id="realUsedDisplay" style="font-weight: 700; font-size: 12px; color: #fca5a5;">0 원</span></div>
          <div><span style="display: block; color: rgba(255,255,255,0.7); margin-bottom: 2px;">6% 할인 혜택</span><span id="chargeDiscountDisplay" style="font-weight: 700; font-size: 12px; color: #86efac;">0 원</span></div>
          <div style="grid-column: span 2; margin-top: 4px;"><span style="display: block; color: rgba(255,255,255,0.7); margin-bottom: 2px;">총 이득 포인트</span><span id="totalBenefitDisplay" style="font-weight: 700; font-size: 13px; color: #fde047;">0 원</span></div>
        </div>
      </section>

      <section style="min-width: 100%; scroll-snap-align: center;" class="other-gradient clean-card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <span style="font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.7); text-transform: uppercase;">OTHER CHARGERS</span>
            <h2 id="totalOtherChargeDisplay" style="font-size: 28px; font-weight: 900; margin-top: 4px;">0 <span style="font-size: 14px; font-weight: normal; opacity: 0.7;">원</span></h2>
          </div>
          <div style="background: rgba(255,255,255,0.15); padding: 10px; border-radius: 14px;"><i class="fa-solid fa-gas-pump" style="font-size: 16px; color: #93c5fd;"></i></div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.2); font-size: 11px;">
          <span style="color: rgba(255,255,255,0.7);">타 충전소 이용 건수</span>
          <span id="otherChargeCountDisplay" style="font-weight: 700; font-size: 13px;">0 건</span>
        </div>
      </section>

      <section style="min-width: 100%; scroll-snap-align: center;" class="tesla-gradient clean-card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <span style="font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.8); text-transform: uppercase;">SUPERCHARGER</span>
            <h2 id="totalTeslaDisplay" style="font-size: 28px; font-weight: 900; margin-top: 4px;">0 <span style="font-size: 14px; font-weight: normal; opacity: 0.7;">원</span></h2>
          </div>
          <div style="background: rgba(255,255,255,0.15); width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center;">
            <svg style="width: 22px; height: 22px; fill: #ffffff;" viewBox="0 0 100 100"><path d="M96.5,15.2C85,12.7,46.5,12,46.5,12s-38.5,0.7-50,3.2C6.3,16.5,3.7,21.5,4,27.5C4.3,34,5,44,5,44s3.7,1,11,1.5 c6,0.5,10.2-0.5,11-1.5c0,0,0.5-12.2,0.7-18c0.2-5.8,1.2-7.5,7-7.7c11.5-0.5,31-0.7,31-0.7s19.5,0.2,31,0.7c5.8,0.2,6.8,1.8,7,7.7 c0.2,5.8,0.7,18,0.7,18c0.8,1,5,2,11,1.5c7.3-0.5,11-1.5,11-1.5s0.7-10,1-16.5C96.3,21.5,93.7,16.5,96.5,15.2z"/><path d="M41,35.5c0,0-1,34-1,40.5c0,6.5,2,9,9.5,9.5c7.5,0.5,9.5-3,9.5-9.5c0-6.5-1-40.5-1-40.5s-8.5-0.2-17,0-8.5,0-8.5,0Z"/></svg>
          </div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.2); font-size: 11px;">
          <span style="color: rgba(255,255,255,0.8);">슈퍼차저 누적 건수</span>
          <span id="teslaCountDisplay" style="font-weight: 700; font-size: 13px;">0 건</span>
        </div>
      </section>

      <section style="min-width: 100%; scroll-snap-align: center;" class="expense-gradient clean-card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <span style="font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.8); text-transform: uppercase;">GENERAL EXPENSE</span>
            <h2 id="totalGeneralExpenseDisplay" style="font-size: 28px; font-weight: 900; margin-top: 4px;">0 <span style="font-size: 14px; font-weight: normal; opacity: 0.7;">원</span></h2>
          </div>
          <div style="background: rgba(255,255,255,0.15); padding: 10px; border-radius: 14px;"><i class="fa-solid fa-wrench" style="font-size: 16px; color: #cbd5e1;"></i></div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.2); font-size: 11px;">
          <span style="color: rgba(255,255,255,0.8);">지출 내역 건수</span>
          <span id="generalExpenseCountDisplay" style="font-weight: 700; font-size: 13px;">0 건</span>
        </div>
      </section>

    </div>
    <div style="display: flex; justify-content: center; gap: 5px; margin-top: 10px;" id="dotContainer">
      <button type="button" onclick="scrollToCard(0)" id="dot0" style="width: 16px; height: 5px; border-radius: 3px; background: #c084fc; border: none; cursor: pointer;"></button>
      <button type="button" onclick="scrollToCard(1)" id="dot1" style="width: 5px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.2); border: none; cursor: pointer;"></button>
      <button type="button" onclick="scrollToCard(2)" id="dot2" style="width: 5px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.2); border: none; cursor: pointer;"></button>
      <button type="button" onclick="scrollToCard(3)" id="dot3" style="width: 5px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.2); border: none; cursor: pointer;"></button>
    </div>
  </div>

  <!-- 총 지출 금액 박스 -->
  <section class="clean-card" style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; padding: 18px 20px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="background: rgba(244, 63, 94, 0.15); color: #f43f5e; width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; border: 1px solid rgba(244, 63, 94, 0.3);">
        <i class="fa-solid fa-wallet"></i>
      </div>
      <div>
        <span style="font-size: 10px; font-weight: 700; color: #a78bfa; text-transform: uppercase; display: block; margin-bottom: 1px;">TOTAL EXPENSE</span>
        <span style="font-size: 10px; color: var(--sub-text);">통장 출금 총액 기준</span>
      </div>
    </div>
    <div style="text-align: right;">
      <h3 id="totalExpenseDisplay" style="font-size: 20px; font-weight: 900; color: #f43f5e;">0 원</h3>
    </div>
  </section>

  <!-- 새 내역 기록하기 -->
  <section class="clean-card" style="margin-bottom: 16px;">
    <h3 style="font-size: 13px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 6px;">
      <i class="fa-solid fa-pen-to-square" style="color: #c084fc;"></i> 새 내역 기록하기
    </h3>
    <form id="recordForm" style="display: flex; flex-direction: column; gap: 12px;">
      <div>
        <label style="display: block; font-size: 11px; font-weight: 700; color: var(--sub-text); margin-bottom: 5px;">구분</label>
        <select id="category" onchange="handleCategoryInput()" class="input-field" required>
          <option value="채비 카드 잔여">[채비] 카드 잔여금 기입</option>
          <option value="채비 카드충전">[채비] 카드 선금 충전</option>
          <option value="채비 번개크레딧">[채비] 번개 크래딧</option>
          <option value="기타 충전소 차감">[충전] 기타</option>
          <option value="테슬라 충전지출">[충전] 슈퍼차저</option>
          <option value="정비항목 지출내역">[지출] 기타</option>
        </select>
      </div>
      <div>
        <label style="display: block; font-size: 11px; font-weight: 700; color: var(--sub-text); margin-bottom: 5px;">날짜</label>
        <div onclick="openCalendar()" class="input-field" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
          <span id="selectedDateText">날짜를 선택하세요</span>
          <i class="fa-regular fa-calendar" style="color: #c084fc;"></i>
        </div>
        <input type="text" id="recordDate" style="display:none;" required>
      </div>
      <div>
        <label id="amountLabel" style="display: block; font-size: 11px; font-weight: 700; color: var(--sub-text); margin-bottom: 5px;">금액 (원)</label>
        <input type="number" id="amount" placeholder="금액을 입력하세요" class="input-field" required>
        <p id="pointPreview" style="font-size: 11px; font-weight: 600; color: #c084fc; margin-top: 5px; display: none;"></p>
      </div>
      <div>
        <label style="display: block; font-size: 11px; font-weight: 700; color: var(--sub-text); margin-bottom: 5px;">상세 내용 / 메모</label>
        <input type="text" id="memo" placeholder="예: 슈퍼차저, 타이어 교환 등" class="input-field">
      </div>
      <button type="submit" style="width: 100%; background: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%); color: #ffffff; font-weight: 700; padding: 14px; border-radius: 12px; border: 1px solid rgba(168, 85, 247, 0.4); cursor: pointer; font-size: 14px; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);">
        <i class="fa-solid fa-check" style="margin-right: 5px;"></i> 저장하기 (Gist 자동 동기화)
      </button>
    </form>
  </section>

  <!-- 기록 목록 및 통계 -->
  <section class="clean-card">
    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px;">
          <i class="fa-solid fa-list" style="color: #c084fc;"></i> 기록 목록
        </h3>
        <span id="recordCount" style="font-size: 10px; font-weight: 700; background: rgba(255,255,255,0.08); color: var(--sub-text); padding: 2px 8px; border-radius: 12px;">0건</span>
      </div>
      <div style="display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 6px;">
        <select id="filterCategory" onchange="handleCategoryChange()" class="input-field" style="padding: 8px 10px; font-size: 12px;">
          <option value="">전체보기</option>
          <option value="채비 카드 잔여">[채비] 카드 잔여금 기입</option>
          <option value="채비 카드충전">[채비] 카드 선금 충전</option>
          <option value="채비 총구독비">[채비] 총구독비</option>
          <option value="채비 월 보너스 크레딧">[채비] 월 보너스 크레딧</option>
          <option value="채비 보너스포인트 적립">[채비] 충전 적립 5%</option>

<script>
// ==================== [GitHub Gist API 설정] ====================
const GIST_TOKEN = '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';
const GIST_ID = '876036e2e2755d9d39d962dfa1b9975d';
// ===============================================================

function initTheme() {

}

function toggleTheme() {

let currentCalDate = new Date();
let selectedDateStr = new Date().toISOString().split('T')[0];

function initCalendarUI() {
  const dateInput = document.getElementById('recordDate');
  const dateText = document.getElementById('selectedDateText');
  if (dateInput) dateInput.value = selectedDateStr;
  if (dateText) {
    const d = new Date(selectedDateStr);

function changeMonth(diff) {
  currentCalDate.setMonth(currentCalDate.getMonth() + diff);
  renderCalendarGrid();
}

function renderCalendarGrid() {
  const year = currentCalDate.getFullYear();
  const month = currentCalDate.getMonth();
  const titleEl = document.getElementById('calTitle');
  if (titleEl) titleEl.textContent = `${year}년 ${month + 1}월`;

  const firstDay = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month + 1, 0).getDate();
  const prevLastDate = new Date(year, month, 0).getDate();

  let daysHtml = '';
  for (let i = firstDay - 1; i >= 0; i--) {
    const dayNum = prevLastDate - i;
    const prevMonth = month === 0 ? 11 : month - 1;
    const prevYear = month === 0 ? year - 1 : year;
    const fullStr = `${prevYear}-${String(prevMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
    daysHtml += `<div class="cal-cell other-month" onclick="selectDate('${fullStr}')">${dayNum}</div>`;
  }

  for (let i = 1; i <= lastDate; i++) {
    const fullStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    const isSelected = fullStr === selectedDateStr ? 'selected' : '';
    daysHtml += `<div class="cal-cell ${isSelected}" onclick="selectDate('${fullStr}')">${i}</div>`;
  }

  const totalCells = firstDay + lastDate;
  const nextDays = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let i = 1; i <= nextDays; i++) {
    const nextMonth = month === 11 ? 0 : month + 1;
    const nextYear = month === 11 ? year + 1 : year;
    const fullStr = `${nextYear}-${String(nextMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    daysHtml += `<div class="cal-cell other-month" onclick="selectDate('${fullStr}')">${i}</div>`;
  }

  const gridEl = document.getElementById('calDays');
  if (gridEl) gridEl.innerHTML = daysHtml;
}

function selectDate(dateStr) {
  selectedDateStr = dateStr;
  const dateInput = document.getElementById('recordDate');
  const dateText = document.getElementById('selectedDateText');
  if (dateInput) dateInput.value = dateStr;
  if (dateText) {
    const d = new Date(dateStr);
    dateText.textContent = `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')}`;
  }
  closeCalendar();
}

let records = [];

// [Gist 연동] GitHub Gist에서 data.json 불러오기 (CORS 우회 적용)
async function loadFromGist() {
  try {
    const rawUrl = `https://gist.githubusercontent.com/nec-works/${GIST_ID}/raw/data.json?t=${Date.now()}`;
    const res = await fetch(rawUrl);
    if (res.ok) {
      const jsonData = await res.json();
      if (Array.isArray(jsonData)) {
        records = jsonData;
      }
      checkAndGenerateAutomaticRecords();
      saveAndRender(false);
      return;
    }
  } catch (e) {
    console.warn("Gist Raw 로드 실패, API 방식으로 재시도");
  }

  try {
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}?t=${Date.now()}`, {
      headers: { 'Authorization': `Bearer ${GIST_TOKEN}` }
    });
    if (res.ok) {
      const data = await res.json();
      if (data.files && data.files['data.json']) {
        const fileContent = data.files['data.json'].content;
        records = JSON.parse(fileContent);
      }
      checkAndGenerateAutomaticRecords();
      saveAndRender(false);
      return;
    }
  } catch (e) {
    console.warn("Gist API 로드 실패, 로컬 데이터 사용");
  }

  records = JSON.parse(localStorage.getItem('nathe_car_records')) || [];
  checkAndGenerateAutomaticRecords();
  saveAndRender(false);
}

// [Gist 연동] GitHub Gist에 데이터 자동 저장
async function saveToGist() {
  try {
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      method: 'PATCH',
      headers: {
        'Authorization': `Bearer ${GIST_TOKEN}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        files: {
          'data.json': {
            content: JSON.stringify(records, null, 2)
          }
        }
      })
    });
    if (!res.ok) {
      console.warn("Gist 저장 응답 에러 코드:", res.status);
    }
  } catch (err) {
    console.warn("Gist 자동 저장 실패 (로컬에만 반영됨)");
  }
}

function checkAndGenerateAutomaticRecords() {
  let modified = false; 
  const now = new Date(); 
  const currentYear = now.getFullYear(); 
  const currentMonth = now.getMonth() + 1;

  let targetMonths = [];
  for (let m = 7; m <= 10; m++) { targetMonths.push({ year: 2026, month: m }); }
  if (currentYear > 2026 || (currentYear === 2026 && currentMonth >= 11)) {
    for (let m = 11; m <= currentMonth; m++) {
      const checkDate = new Date(currentYear, m - 1, 12);
      if (now >= checkDate) { targetMonths.push({ year: currentYear, month: m }); }
    }
  }

  targetMonths.forEach(item => {
    const mm = String(item.month).padStart(2, '0'); 
    const dateStr = `${item.year}-${mm}-12`;

    const subExists = records.some(r => (r.category === '채비 월 구독비' || r.category === '채비 총구독비') && r.date === dateStr);
    if (!subExists) { 
      records.push({ id: Date.now() + Math.random(), category: '채비 총구독비', date: dateStr, amount: 4900, memo: `${item.month}월 정기 구독비` }); 
      modified = true; 
    }

    const bonusExists = records.some(r => (r.category === '채비 월 보너스포인트' || r.category === '채비 월 보너스 크레딧') && r.date === dateStr);
    if (!bonusExists) { 
      records.push({ id: Date.now() + Math.random(), category: '채비 월 보너스 크레딧', date: dateStr, amount: 3000, memo: `${item.month}월 정기 보너스크레딧` }); 
      modified = true; 
    }
  });

  if (modified) { 
    localStorage.setItem('nathe_car_records', JSON.stringify(records)); 
  }
}

function resetData() {
  if (confirm('모든 기록을 초기화하시겠습니까?')) {
    records = [];
    checkAndGenerateAutomaticRecords();
    saveAndRender(true);
  }
}

const cardSlider = document.getElementById('cardSlider'); 
const dots = [document.getElementById('dot0'), document.getElementById('dot1'), document.getElementById('dot2'), document.getElementById('dot3')];

if (cardSlider) {

    cardSlider.scrollTo({ left: cardSlider.clientWidth * index, behavior: 'smooth' });

const categorySelect = document.getElementById('category'); 
const amountInput = document.getElementById('amount'); 
const amountLabel = document.getElementById('amountLabel'); 
const pointPreview = document.getElementById('pointPreview');

function handleCategoryInput() {
  if (!categorySelect) return;
  const cat = categorySelect.value;
  if (amountInput) amountInput.readOnly = false; 
  if (amountLabel) amountLabel.textContent = "금액 (원)";
  if (cat === '채비 카드충전') { updatePointPreview(); } else if (pointPreview) { pointPreview.style.display = 'none'; }

  if (cat.startsWith('채비')) { scrollToCard(0); }
  else if (cat === '기타 충전소 차감') { scrollToCard(1); }
  else if (cat === '테슬라 충전지출') { scrollToCard(2); }
  else if (cat === '정비항목 지출내역') { scrollToCard(3); }
}

if (amountInput) {
  amountInput.addEventListener('input', () => { 
    if (categorySelect && categorySelect.value === '채비 카드충전') { updatePointPreview(); } 
  });
}

function updatePointPreview() {
  if (!amountInput || !pointPreview) return;
  const val = Number(amountInput.value) || 0; 
  const earnedPoint = Math.floor(val * 0.05);
  if (val > 0) { 
    pointPreview.textContent = `💡 저장 시 5% 적립금 (${earnedPoint.toLocaleString()}원)이 자동 적립됩니다.`; 
    pointPreview.style.display = 'block'; 
  } else { 
    pointPreview.style.display = 'none'; 
  }
}

const recordForm = document.getElementById('recordForm');
if (recordForm) {
  recordForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const category = categorySelect ? categorySelect.value : '기타'; 
    const dateInputEl = document.getElementById('recordDate');
    const date = dateInputEl ? dateInputEl.value : selectedDateStr; 
    const amount = amountInput ? Number(amountInput.value) : 0; 
    const memoEl = document.getElementById('memo');
    const memo = memoEl ? memoEl.value : '';

    records.push({ id: Date.now(), category, date, amount, memo });
    if (category === '채비 카드충전') {
      const earnedPoint = Math.floor(amount * 0.05);
      if (earnedPoint > 0) { records.push({ id: Date.now() + 1, category: '채비 보너스포인트 적립', date, amount: earnedPoint, memo: memo ? `${memo} 충전 적립 5%` : '충전 적립 5%' }); }
    }
    saveAndRender(true); 
    recordForm.reset(); 
    initCalendarUI(); 
    handleCategoryInput();
  });
}

function saveAndRender(syncGist = true) { 
  localStorage.setItem('nathe_car_records', JSON.stringify(records)); 
  updateFilterYears(); 
  renderApp();
  if (syncGist) {
    saveToGist();
  }
}

const filterCategory = document.getElementById('filterCategory'); 
const filterYear = document.getElementById('filterYear'); 
const filterMonth = document.getElementById('filterMonth');

function handleCategoryChange() {
  if (!filterCategory || !filterYear || !filterMonth) return;
  const catVal = filterCategory.value;
  if (!catVal) { 
    filterYear.value = ""; filterYear.disabled = true; filterYear.innerHTML = '<option value="">연도 선택</option>'; 
    filterMonth.value = ""; filterMonth.disabled = true; filterMonth.innerHTML = '<option value="">월 선택</option>'; 
  } else { 
    updateFilterYears(); filterYear.disabled = false; 
    filterMonth.value = ""; filterMonth.disabled = true; filterMonth.innerHTML = '<option value="">월 선택</option>'; 
  }
  renderApp();
}

function handleYearChange() {
  if (!filterYear || !filterMonth) return;
  const yearVal = filterYear.value;
  if (!yearVal) { filterMonth.value = ""; filterMonth.disabled = true; filterMonth.innerHTML = '<option value="">월 선택</option>'; } 
  else { updateFilterMonths(); filterMonth.disabled = false; }
  renderApp();
}

function updateFilterYears() {
  if (!filterCategory || !filterYear) return;
  const catVal = filterCategory.value; 
  const filtered = catVal ? records.filter(r => r.category === catVal || (catVal === '채비 총구독비' && (r.category === '채비 월 구독비' || r.category === '채비 총구독비')) || (catVal === '채비 월 보너스 크레딧' && (r.category === '채비 월 보너스포인트' || r.category === '채비 월 보너스 크레딧')) || (catVal === '채비 보너스포인트 적립' && r.category === '채비 보너스포인트 적립')) : records;
  const years = [...new Set(filtered.map(r => r.date.split('-')[0]))].sort().reverse();
  const currentYear = filterYear.value; 
  let optionsHtml = '<option value="">모든 연도</option>';
  years.forEach(y => { optionsHtml += `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y}년</option>`; });
  filterYear.innerHTML = optionsHtml;
  if (years.length === 0) { filterYear.value = ""; filterYear.disabled = true; }
}

function updateFilterMonths() {
  if (!filterCategory || !filterYear || !filterMonth) return;
  const catVal = filterCategory.value; const yearVal = filterYear.value;
  const filtered = records.filter(r => { const [y, m] = r.date.split('-'); const matchCat = !catVal || r.category === catVal || (catVal === '채비 총구독비' && (r.category === '채비 월 구독비' || r.category === '채비 총구독비')) || (catVal === '채비 월 보너스 크레딧' && (r.category === '채비 월 보너스포인트' || r.category === '채비 월 보너스 크레딧')) || (catVal === '채비 보너스포인트 적립' && r.category === '채비 보너스포인트 적립'); return matchCat && (!yearVal || y === yearVal); });
  const months = [...new Set(filtered.map(r => r.date.split('-')[1]))].sort();
  const currentMonth = filterMonth.value; 
  let optionsHtml = '<option value="">모든 월</option>';
  months.forEach(m => { optionsHtml += `<option value="${m}" ${m === currentMonth ? 'selected' : ''}>${Number(m)}월</option>`; });
  filterMonth.innerHTML = optionsHtml;
  if (months.length === 0) { filterMonth.value = ""; filterMonth.disabled = true; }
}

function deleteRecord(id) { 
  if(confirm('정말 이 내역을 삭제하시겠습니까?')) { 
    records = records.filter(r => r.id !== id); 
    saveAndRender(true); 
  } 
}

function renderApp() {
  let totalRealCharge = 0, totalExpense = 0, totalBenefit = 0, totalOtherCharge = 0, otherChargeCount = 0, totalTesla = 0, teslaCount = 0, totalGeneralExpense = 0, generalExpenseCount = 0, manualRemaining = null, latestRemainingDate = "";

  records.forEach(r => {
    if (r.category === '채비 카드충전') { totalRealCharge += r.amount; totalExpense += r.amount; }
    else if (r.category === '채비 카드 잔여') { if (!latestRemainingDate || r.date >= latestRemainingDate) { manualRemaining = r.amount; latestRemainingDate = r.date; } }
    else if (r.category === '채비 보너스포인트 적립' || r.category === '채비 월 보너스포인트' || r.category === '채비 월 보너스 크레딧' || r.category === '채비 번개크레딧') { totalBenefit += r.amount; }
    else if (r.category === '기타 충전소 차감') { totalOtherCharge += r.amount; otherChargeCount++; totalExpense += r.amount; }
    else if (r.category === '테슬라 충전지출') { totalTesla += r.amount; teslaCount++; totalExpense += r.amount; }
    else if (r.category === '정비항목 지출내역' || r.category === '기타 지출내역') { totalGeneralExpense += r.amount; generalExpenseCount++; totalExpense += r.amount; }
    else { totalExpense += r.amount; }
  });

  let totalEarnedBenefit = totalBenefit;
  let finalCardRemaining = manualRemaining !== null ? manualRemaining : (totalRealCharge + totalEarnedBenefit);
  let realUsedAmount = (totalRealCharge + totalEarnedBenefit) - finalCardRemaining;
  if (realUsedAmount < 0) realUsedAmount = 0;
  let chargeDiscountAmount = Math.floor(realUsedAmount * 0.06);

  document.getElementById('cardRemaining').textContent = finalCardRemaining.toLocaleString() + " 원";
  document.getElementById('realUsedDisplay').textContent = realUsedAmount.toLocaleString() + " 원";
  document.getElementById('chargeDiscountDisplay').textContent = chargeDiscountAmount.toLocaleString() + " 원";
  document.getElementById('totalBenefitDisplay').textContent = totalEarnedBenefit.toLocaleString() + " 원";
  document.getElementById('totalOtherChargeDisplay').innerHTML = `${totalOtherCharge.toLocaleString()} <span style="font-size: 14px; font-weight: normal; opacity: 0.7;">원</span>`;
  document.getElementById('otherChargeCountDisplay').textContent = `${otherChargeCount}건`;
  document.getElementById('totalTeslaDisplay').innerHTML = `${totalTesla.toLocaleString()} <span style="font-size: 14px; font-weight: normal; opacity: 0.7;">원</span>`;
  document.getElementById('teslaCountDisplay').textContent = `${teslaCount}건`;
  document.getElementById('totalGeneralExpenseDisplay').innerHTML = `${totalGeneralExpense.toLocaleString()} <span style="font-size: 14px; font-weight: normal; opacity: 0.7;">원</span>`;
  document.getElementById('generalExpenseCountDisplay').textContent = `${generalExpenseCount}건`;
  document.getElementById('totalExpenseDisplay').textContent = `${totalExpense.toLocaleString()} 원`;

  const catVal = filterCategory ? filterCategory.value : ""; 
  const yearVal = filterYear ? filterYear.value : ""; 
  const monthVal = filterMonth ? filterMonth.value : "";

  let displayedRecords = records.filter(r => {
    const [y, m] = r.date.split('-');
    const matchCat = !catVal || r.category === catVal || (catVal === '채비 총구독비' && (r.category === '채비 월 구독비' || r.category === '채비 총구독비')) || (catVal === '채비 월 보너스 크레딧' && (r.category === '채비 월 보너스포인트' || r.category === '채비 월 보너스 크레딧')) || (catVal === '채비 보너스포인트 적립' && r.category === '채비 보너스포인트 적립');
    const matchYear = !yearVal || y === yearVal; const matchMonth = !monthVal || m === monthVal;
    return matchCat && matchYear && matchMonth;
  });
  displayedRecords.sort((a, b) => new Date(b.date) - new Date(a.date));
  document.getElementById('recordCount').textContent = `${displayedRecords.length}건`;

  const recordList = document.getElementById('recordList');
  if (!recordList) return;
  if (displayedRecords.length === 0) {
    recordList.innerHTML = `<div style="text-align: center; padding: 24px 0; color: var(--sub-text); font-size: 11px;"><i class="fa-regular fa-folder-open" style="font-size: 20px; margin-bottom: 6px; display: block;"></i>조건에 일치하는 기록이 없습니다.</div>`;
    return;
  }

  let html = '';
  displayedRecords.forEach(r => {
    let badgeBg = 'rgba(168, 85, 247, 0.1)';
    let badgeColor = '#c084fc';
    let displaySign = '';
    let amountColor = 'var(--text-color)';

    const catName = (r.category === '채비 월 구독비' || r.category === '채비 총구독비') ? '[채비] 총구독비' : ((r.category === '채비 월 보너스포인트' || r.category === '채비 월 보너스 크레딧') ? '[채비] 월 보너스 크레딧' : (r.category === '채비 보너스포인트 적립' ? '[채비] 충전 적립 5%' : r.category));

    if (r.category === '채비 카드충전') { badgeBg = 'rgba(34, 197, 94, 0.1)'; badgeColor = '#22c55e'; displaySign = '-'; amountColor = '#ef4444'; }
    else if (r.category === '채비 카드 잔여') { badgeBg = 'rgba(168, 85, 247, 0.1)'; badgeColor = '#c084fc'; }
    else if (r.category === '채비 월 구독비' || r.category === '채비 총구독비') { badgeBg = 'rgba(6, 182, 212, 0.1)'; badgeColor = '#06b6d4'; displaySign = '-'; amountColor = '#ef4444'; }
    else if (r.category === '채비 월 보너스포인트' || r.category === '채비 월 보너스 크레딧' || r.category === '채비 보너스포인트 적립' || r.category === '채비 번개크레딧') { badgeBg = 'rgba(168, 85, 247, 0.1)'; badgeColor = '#c084fc'; }
    else if (r.category === '기타 충전소 차감') { badgeBg = 'rgba(147, 51, 234, 0.1)'; badgeColor = '#9333ea'; displaySign = '-'; amountColor = '#ef4444'; }
    else if (r.category === '테슬라 충전지출') { badgeBg = 'rgba(239, 68, 68, 0.15)'; badgeColor = '#ef4444'; displaySign = '-'; amountColor = '#ef4444'; }
    else if (r.category === '정비항목 지출내역' || r.category === '기타 지출내역') { badgeBg = 'rgba(51, 65, 85, 0.15)'; badgeColor = 'var(--sub-text)'; displaySign = '-'; amountColor = '#ef4444'; }

    html += `<div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--input-bg); border: var(--input-border); border-radius: 12px; transition: 0.2s;">
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <div style="display: flex; align-items: center; gap: 5px;">
          <span style="font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: ${badgeBg}; color: ${badgeColor};">${catName}</span>
          <span style="font-size: 10px; color: var(--sub-text);">${r.date}</span>
        </div>
        <p style="font-size: 11px; font-weight: 500; color: var(--text-color);">${r.memo ? r.memo : '메모 없음'}</p>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 13px; font-weight: 800; color: ${amountColor};">${displaySign}${r.amount.toLocaleString()}원</span>
        <button type="button" onclick="deleteRecord(${r.id})" style="background: none; border: none; color: var(--sub-text); cursor: pointer; font-size: 12px;"><i class="fa-solid fa-trash-can"></i></button>
      </div>
    </div>`;
  });
  recordList.innerHTML = html;
}

// 최초 실행 시 캘린더 및 Gist 데이터 로드
initCalendarUI();
loadFromGist();
</script>
</body>
</html>
